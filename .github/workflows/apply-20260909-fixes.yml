name: Apply 20260909 fixes

on:
  push:
    branches:
      - work/depuis-13d5147
    paths:
      - .github/workflows/apply-20260909-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/depuis-13d5147
          fetch-depth: 0

      - name: Apply source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply-20260909-fixes.py')
          t=p.read_text(encoding='utf-8')
          old="new, count = re.subn(pattern, repl, text, count=1, flags=re.S)"
          new="new, count = re.subn(pattern, lambda _m: repl, text, count=1, flags=re.S)"
          if old not in t:
              raise SystemExit('Correctif du moteur de remplacement introuvable')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/scripts/apply-20260909-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/index.js')
          t=p.read_text(encoding='utf-8')
          bad="app.post('/api/learner/join-by-code, joinLimiter"
          good="app.post('/api/learner/join-by-code', joinLimiter"
          if bad not in t:
              raise SystemExit('Route join-by-code attendue introuvable')
          p.write_text(t.replace(bad,good,1),encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in api.js app.js learner.js exam.js powerpoint.js server/index.js synchronized-clock.js; do
            node --check "$f"
          done

      - name: Verify expected changes
        shell: bash
        run: |
          set -euo pipefail
          test -f synchronized-clock.js
          test -f db/migrations/20260909_02_timer_podium_preferences.sql
          grep -q "podium-preference" learner.js
          grep -q "createSynchronizedClock" exam.js
          grep -q "createSynchronizedClock" powerpoint.js
          grep -q "podium_preference_set_at" server/index.js
          grep -q "podium_alias" db/migrations/20260909_02_timer_podium_preferences.sql

      - name: Commit corrected version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          rm -f .github/scripts/apply-20260909-fixes.py .github/workflows/apply-20260909-fixes.yml
          git add -A
          git commit -m "Corrige les chronos synchronisés et les préférences de podium"
          git push origin HEAD:work/depuis-13d5147
